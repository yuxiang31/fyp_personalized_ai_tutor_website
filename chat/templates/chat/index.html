{% comment %} LATEST CODE {% endcomment %}
<!DOCTYPE html>
{% load static %}
<html lang="en">
</header>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WebSocket Chat</title>
    <script src="{% static 'js/chat.js' %}" defer></script>
    <script src="{% static 'js/profile.js' %}" defer></script>
    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
    <link rel="stylesheet" href="{% static 'css/chatButton.css' %}">
    <link rel="stylesheet" href="{% static 'css/chatContainer.css' %}">
</head>

<body>
    <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
            <div class="conversation-history">
                <div class="history-header">
                    <button class="sidebar-btn new-chat-btn" id="newChatBtn" title="New Chat">New Chat</button>
                    <h3>Conversation History</h3>
                </div>
                <div id="historyContainer">
                    {% for conversation in conversations %}
                    <div class="history-item {% if current_conversation.id == conversation.id %}active{% endif %}"
                         data-conversation-id="{{ conversation.id }}"
                         data-thread-id="{{ conversation.thread_id }}">
                        <span class="conversation-title" title="{{ conversation.conversation_title }}">{{ conversation.conversation_title }}</span>
                        <span class="conversation-date">{{ conversation.updated_at|date:"M d, Y" }}</span>
                        <button class="delete-conversation-btn" title="Delete conversation" aria-label="Delete conversation" data-thread-id="{{ conversation.thread_id }}">×</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <div class="sidebar-buttons">
                <button class="sidebar-btn profile-btn" id="profileBtn">Profile</button>
                <button class="sidebar-btn logout-btn" id="logoutBtn">Logout</button>
            </div>

            <!-- Drag handle to resize the sidebar (positioned at the right edge) -->
            <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
        </div>
        <!-- Chat Header -->
        <div class="chat-header">
            <h1 id="chatTitle">{{ current_conversation.conversation_title }}</h1>
            <div class="connection-status">
                <span id="statusText">Connecting...</span>
                <span class="status-indicator" id="statusIndicator"></span>
            </div>
        </div>

        <!-- Chat Messages Area -->
    <div class="chat-messages" id="chatMessages" data-thread-id="{{ current_conversation.thread_id }}"></div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message here..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" type="button">
                    ➤
                </button>
            </div>
        </div>
    </div>
</body>
</html>
